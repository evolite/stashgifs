name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master

      - name: Parse version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        run: |
          set -euo pipefail
          GC_VER=$(curl -sSf https://api.github.com/repos/orhun/git-cliff/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'][1:])")
          INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$INSTALL_DIR"
          TMP_DIR=$(mktemp -d)
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${GC_VER}/git-cliff-${GC_VER}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$TMP_DIR/git-cliff.tar.gz"
          tar -xzf "$TMP_DIR/git-cliff.tar.gz" -C "$TMP_DIR"
          BIN_PATH=$(find "$TMP_DIR" -type f -name git-cliff | head -n1)
          if [ -z "$BIN_PATH" ]; then
            echo "git-cliff binary not found in extracted archive" >&2
            exit 1
          fi
          install -m 0755 "$BIN_PATH" "$INSTALL_DIR/git-cliff"
          rm -rf "$TMP_DIR"
          # Register install dir on PATH for all subsequent steps (act/Forgejo native way).
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          # Also export for the remainder of this step in case GITHUB_PATH is honored lazily.
          export PATH="$INSTALL_DIR:$PATH"
          "$INSTALL_DIR/git-cliff" --version

      - name: Bump version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DATE=$(date +"%Y-%m-%d %H:%M:%S")
          sed -i "s/^version: .*/version: $VERSION/" stashgifs/manifest
          sed -i "s/^date: .*/date: \"$DATE\"/" stashgifs/manifest
          sed -i "s/^version: .*/version: $VERSION/" stashgifs/stashgifs.yml
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='$VERSION'; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Update changelog
        run: git-cliff --tag "${{ github.ref_name }}" -o CHANGELOG.md

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Commit version bump
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f stashgifs/manifest stashgifs/stashgifs.yml package.json src/version.ts CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(release): bump version to ${{ steps.ver.outputs.version }}"
          git push origin HEAD:master

      - name: Create zip
        run: |
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('stashgifs.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk('stashgifs'):
                  for f in files:
                      zf.write(os.path.join(root, f))
          "

      - name: Compute sha256
        id: sha
        run: echo "hash=$(sha256sum stashgifs.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(git-cliff --tag "$GITHUB_REF_NAME" --latest --strip all)
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" stashgifs.zip --title "$GITHUB_REF_NAME" --notes "$NOTES"

      - name: Update pages index
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          HASH: ${{ steps.sha.outputs.hash }}
          TAG: ${{ github.ref_name }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone "https://surging9143:${CODEBERG_TOKEN}@codeberg.org/surging9143/pages.git" /tmp/pages
          export DATE=$(date +"%Y-%m-%d %H:%M:%S")
          export URL="https://github.com/evolite/stashgifs/releases/download/${TAG}/stashgifs.zip"
          python3 .github/update_pages.py
          cd /tmp/pages
          git add index.yml
          git diff --staged --quiet || git commit -m "Update stashgifs to v${VERSION}"
          git push
