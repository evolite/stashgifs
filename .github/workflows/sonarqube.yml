# SonarQube Community scan of the default branch (no PR analysis on this edition).
# Needs repo secrets SONAR_TOKEN and SONAR_HOST_URL; skipped until both exist.
# Project key and sources come from sonar-project.properties.
name: SonarQube analysis

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # "New code" is measured against the previous version, so send one on every scan.
      - name: Read version
        id: ver
        run: echo "version=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Analyze with SonarQube
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          args: -Dsonar.projectVersion=${{ steps.ver.outputs.version }}
