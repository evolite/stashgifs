on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: orange-runner
    steps:
      - uses: actions/checkout@v3

      - name: Install deps
        run: npm ci --omit=optional

      - name: Build
        run: npm run build
        env:
          BUILD_HASH: ${{ github.sha }}

      - name: Deploy to Stash plugins
        run: |
          TARGET="/home/evotech/Services/containers/data/stash/plugins/stashgifs/stashgifs/stashgifs"
          mkdir -p "$TARGET/app/assets"
          rm -rf "$TARGET/app/assets/"*
          cp -r stashgifs/app/assets/. "$TARGET/app/assets/"
          cp stashgifs/app/index.html "$TARGET/app/index.html"
          echo "Deployed $(ls stashgifs/app/assets | wc -l) asset files"
